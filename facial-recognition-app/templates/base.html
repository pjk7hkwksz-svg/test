<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FaceID App{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="/">&#x1F9E0; FaceID</a>
    <ul class="nav-links">
      <li><a href="/">Dashboard</a></li>
      <li><a href="/register">Register Face</a></li>
      <li><a href="/recognize">Recognize</a></li>
    </ul>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Facial Recognition App &mdash; powered by face_recognition + Flask</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
